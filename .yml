name: DevForum Roblox Monitor

on:
  schedule:
    # Roda automaticamente a cada 5 minutos
    - cron: '*/5 * * * *'
  # Permite que você execute o teste manualmente pelo painel do GitHub (Aba Actions)
  workflow_dispatch:

jobs:
    run-monitor:
      runs-on: ubuntu-latest
      steps:
        - name: Baixar código do repositório
          uses: actions/checkout@v4

        - name: Configurar Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Instalar dependências
          run: npm install

        - name: Executar script de monitoramento
          env:
            DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
            TARGET_USER_IDS: ${{ secrets.TARGET_USER_IDS }}
            FORCE_TEST_RUN: ${{ secrets.FORCE_TEST_RUN }}
          run: node index.js