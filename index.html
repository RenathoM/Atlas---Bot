<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor DevForum Roblox</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .log-box { background: #1e1e1e; padding: 15px; border-radius: 8px; max-width: 600px; margin: 20px auto; text-align: left; overflow-y: auto; height: 350px; font-family: monospace; border: 1px solid #333; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        .warning { color: #facc15; }
        button { background: #5865F2; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        button:hover { background: #4752C4; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Monitor do DevForum</h1>
    <p>Para garantir que o áudio funcione e o navegador não hiberne a aba, clique no botão abaixo.</p>
    
    <button id="startBtn">Iniciar Monitoramento</button>

    <div class="log-box" id="logBox">
        <div class="info">Aguardando início...</div>
    </div>

    <script>
        const TOPIC_URL = "https://devforum.roblox.com/t/expanding-roblox-plus-new-ways-for-players-to-personalize-their-profiles-and-app-themes/4751465.json";
        const ROBLOX_API_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(TOPIC_URL)}`; 
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1418572542607622154/Nf1wIq7nM41lSHiziL2TIKDbvoxlbFRg_62xGxYjnq-ngoRHTmRGN5eXp7Y288xKAsMi";
        const ROLE_PING_ID = "1292273276013379765";
        const TOPIC_ID = "4751465"; 
        const CHECK_INTERVAL_MS = 60000; // 60 segundos

        let lastCheckedPostNumber = 0;
        let monitorInterval;
        let blinkInterval;
        let originalTitle = document.title;

        // Som de notificação padrão do Google
        const notificationSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

        function log(message, type = "info") {
            const logBox = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div class="${type}">[${time}] ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Faz a aba piscar e toca um som
        function alertUser() {
            try {
                notificationSound.play();
            } catch (e) {
                log("Som bloqueado pelo navegador.", "warning");
            }
            
            if (!blinkInterval) {
                let showAlert = true;
                blinkInterval = setInterval(() => {
                    document.title = showAlert ? "⚠️ NOVO POST ⚠️" : originalTitle;
                    showAlert = !showAlert;
                }, 1000);
            }
        }

        // Para o alerta quando o usuário clica na página
        window.addEventListener('click', () => {
            if (blinkInterval) {
                clearInterval(blinkInterval);
                blinkInterval = null;
                document.title = originalTitle;
            }
        });

        function extractImage(htmlContent) {
            const div = document.createElement('div');
            div.innerHTML = htmlContent;
            const img = div.querySelector('img');
            return img ? img.src : null;
        }

        function stripHtmlTags(htmlContent) {
            const div = document.createElement('div');
            div.innerHTML = htmlContent;
            return div.textContent || div.innerText || "";
        }

        // Nova função que tenta consultar via proxies com logs de cada etapa
        async function fetchRobloxDataFromUrl(url) {
            const parseResponse = async (response, source) => {
                if (!response.ok) {
                    throw new Error(`${source} retornou ${response.status}`);
                }
                const text = await response.text();
                if (!text) {
                    throw new Error(`${source} retornou corpo vazio`);
                }
                try {
                    const data = JSON.parse(text);
                    return data.contents ? JSON.parse(data.contents) : data;
                } catch (parseError) {
                    throw new Error(`${source} retornou JSON inválido: ${parseError.message}`);
                }
            };

            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            let lastError = null;
            for (let proxy of proxies) {
                try {
                    log(`Tentando proxy: ${proxy}`, "info");
                    const response = await fetch(proxy, { cache: 'no-store' });
                    const result = await parseResponse(response, proxy);
                    log(`Proxy funcionou: ${proxy}`, "success");
                    return result;
                } catch (e) {
                    lastError = e;
                    log(`Proxy falhou: ${proxy} (${e.message})`, "warning");
                }
            }

            throw new Error(`Todos os proxies falharam (Timeout ou Bloqueio pelo Cloudflare). ${lastError ? lastError.message : ''}`);
        }

        async function fetchRobloxData() {
            return fetchRobloxDataFromUrl(TOPIC_URL);
        }

        async function fetchLatestPostById(postId) {
            const postUrl = `https://devforum.roblox.com/posts/${postId}.json`;
            return fetchRobloxDataFromUrl(postUrl);
        }

        async function checkDevForum() {
            log("Verificando atualizações no fórum...");
            try {
                // Chama a nova função com sistema anti-falha
                const data = await fetchRobloxData();
                
                const posts = data.post_stream.posts;
                const topicTitle = data.title;
                let latestPost = posts[posts.length - 1];

                if (data.post_stream && Array.isArray(data.post_stream.stream) && data.post_stream.stream.length > 0) {
                    const latestPostId = data.post_stream.stream[data.post_stream.stream.length - 1];
                    if (!latestPost || latestPost.id !== latestPostId) {
                        latestPost = await fetchLatestPostById(latestPostId);
                    }
                }

                // Primeira execução: envia o post para testar
                if (lastCheckedPostNumber === 0) {
                    lastCheckedPostNumber = latestPost.post_number;
                    log(`Iniciando sistema. Post #${lastCheckedPostNumber} detectado. Enviando teste para o Discord...`, "warning");
                    await sendDiscordWebhook(latestPost, topicTitle, true);
                    return;
                }

                // Execuções seguintes: compara ID/Número do post
                if (latestPost.post_number > lastCheckedPostNumber) {
                    log(`NOVO POST DETECTADO! (Post #${latestPost.post_number})`, "success");
                    alertUser();
                    await sendDiscordWebhook(latestPost, topicTitle, false);
                    lastCheckedPostNumber = latestPost.post_number;
                } else {
                    log(`Nenhum post novo. (Último: #${lastCheckedPostNumber})`);
                }

            } catch (error) {
                log(`Erro: ${error.message}`, "error");
            }
        }

        async function sendDiscordWebhook(post, topicTitle, isTest = false) {
            const plainTextContent = stripHtmlTags(post.cooked).substring(0, 4000); 
            const imageUrl = extractImage(post.cooked);
            
            // Se for teste, avisamos no texto
            const messagePrefix = isTest 
                ? `**[TESTE DE INICIALIZAÇÃO DO MONITOR]**\n<@&${ROLE_PING_ID}> Aqui está o último anúncio/resposta no DevForum!`
                : `<@&${ROLE_PING_ID}> Novo anúncio/resposta no DevForum!`;

            const payload = {
                content: messagePrefix,
                embeds: [{
                    title: topicTitle,
                    url: `https://devforum.roblox.com/t/${TOPIC_ID}/${post.post_number}`,
                    description: plainTextContent,
                    color: 16711680, 
                    timestamp: new Date(post.created_at).toISOString(),
                    author: {
                        name: post.username,
                        url: `https://devforum.roblox.com/u/${post.username}`,
                        icon_url: `https://devforum.roblox.com/user_avatar/devforum.roblox.com/${post.username}/120/1.png`
                    }
                }]
            };

            if (imageUrl) {
                payload.embeds[0].image = { url: imageUrl };
            }

            try {
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    log("Mensagem enviada com sucesso para o Discord!", "success");
                } else {
                    throw new Error(`Erro do Discord: ${response.status}`);
                }
            } catch (error) {
                log(`Falha ao enviar Webhook: ${error.message}`, "error");
            }
        }

        // Inicia apenas quando o botão for clicado
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').innerText = "Monitor Rodando...";
            log("Monitor ativado! O primeiro teste será enviado em instantes.", "success");
            
            // Roda a primeira vez e define o loop
            checkDevForum();
            monitorInterval = setInterval(checkDevForum, CHECK_INTERVAL_MS);
        });

    </script>
</body>
</html>
